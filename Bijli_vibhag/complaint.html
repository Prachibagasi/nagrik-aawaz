<!DOCTYPE html>
<html lang="en">
<head>
    <title>UPCL — File a Complaint</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="mystyle.css">
    <link rel="stylesheet" href="complaint.css">
</head>
<body>

    <!-- Same navbar as main site -->
    <div class="horizontal_2">
        <div class="h2_vertical_1">
            <img class="logo" src="images/upcl-logo.png">
        </div>
        <div class="h2_vertical_2">
            <div class="home" onclick="window.location.href='index.html'">&#8962; Home</div>
            <div class="dropdown">New Connection &#9662;</div>
            <div class="dropdown">Online Payment &#9662;</div>
            <div class="dropdown active-tab">Complaint/Request &#9662;</div>
            <div class="dropdown">Support &#9662;</div>
            <div class="dropdown">Login &#9662;</div>
            <button class="login">SignIn/SignUp</button>
        </div>
    </div>

    <!-- Main complaint page -->
    <div class="complaint-page">

        <!-- LEFT — File complaint form -->
        <div class="complaint-form-box">
            <h2 class="section-title">File a Complaint</h2>

            <div class="form-group">
                <label>Account Number</label>
                <input type="text" id="accountNo" placeholder="Enter your account number">
            </div>

            <div class="form-group">
                <label>Consumer Name</label>
                <input type="text" id="consumerName" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label>District</label>
                <input type="text" id="district" placeholder="Enter your district">
            </div>

            <div class="form-group">
                <label>Email (optional)</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label>Complaint Type</label>
                <select id="complaintType">
                    <option value="">-- Select --</option>
                    <option value="No Power Supply">No Power Supply</option>
                    <option value="Voltage Issue">Voltage Issue</option>
                    <option value="Wrong Bill">Wrong Bill</option>
                    <option value="Meter Fault">Meter Fault</option>
                    <option value="Street Light">Street Light Issue</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="description" rows="4" placeholder="Describe your issue..."></textarea>
            </div>

            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" id="mobile" placeholder="Enter mobile number">
            </div>

            <button class="submit-btn" onclick="fileComplaint()">Submit Complaint</button>
        </div>

        <!-- RIGHT — Dashboard -->
        <div class="complaint-dashboard">
            <h2 class="section-title">My Complaints</h2>

            <div class="dashboard-stats">
                <div class="stat-box" id="totalBox">
                    <span class="stat-num" id="totalCount">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat-box" id="pendingBox">
                    <span class="stat-num" id="pendingCount">0</span>
                    <span class="stat-label">Pending</span>
                </div>
                <div class="stat-box" id="resolvedBox">
                    <span class="stat-num" id="resolvedCount">0</span>
                    <span class="stat-label">Resolved</span>
                </div>
            </div>

            <div class="complaints-list" id="complaintsList">
                <p class="no-complaints">No complaints filed yet.</p>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="horizontal_4">
        <div class="text1"><p class="para_4">Privacy Policy | Disclaimer | Contact Us</p></div>
        <div class="text2"><p class="para_4">@Copyright 2021 — Uttarakhand Power Corporation Limited</p></div>
    </div>

    <script src="../nagrik_prefill.js"></script>
    <script src="complaint.js"></script>
</body>
</html>
